version: '3.8'

services:
  triton:
    build:
      context: .
      dockerfile: Dockerfile
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    ports:
      - "8000:8000"
      - "8001:8001"
      - "8002:8002"
    volumes:
      - ./diffusion-models:/diffusion-models
      - ./:/workspace
      - ./.cache/huggingface:/root/.cache/huggingface 
      - ./backend/diffusion:/opt/tritonserver/backends/diffusion
    environment:
      - MODEL_REPOSITORY=/diffusion-models
      - CUDA_VISIBLE_DEVICES=0
    command: ["tritonserver", "--model-repository", "/diffusion-models", "--model-control-mode", "explicit", "--load-model", "stable_diffusion_xl"]
